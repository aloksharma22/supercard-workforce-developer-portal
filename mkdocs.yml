# ==============================================================================
# Supercard Workforce Developer Portal
# Enterprise-grade MkDocs Material Configuration
# ==============================================================================

site_name: Supercard Workforce Developer Portal
site_description: Enterprise REST API Developer Documentation built with OpenAPI 3.1, MkDocs Material, and Redocly.
site_author: Alok Sharma
site_url: https://aloksharma22.github.io/supercard-workforce-developer-portal/

repo_name: GitHub Repository
repo_url: https://github.com/aloksharma22/supercard-workforce-developer-portal

edit_uri: ""

copyright: |
  Copyright © 2026 Supercard Inc.
  All rights reserved.

docs_dir: docs
site_dir: site

theme:
  name: material

  language: en

  logo: assets/logos/logo.png
  favicon: assets/logos/favicon.png

  icon:

    repo: fontawesome/brands/github

  palette:

    - scheme: default

      primary: indigo
      accent: blue

      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    - scheme: slate

      primary: indigo
      accent: blue

      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:

    text: Roboto
    code: Roboto Mono

  features:

    # -------------------------------------------------------
    # Navigation
    # -------------------------------------------------------

    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch

    - navigation.tabs
    - navigation.tabs.sticky

    - navigation.sections
    - navigation.expand
    - navigation.indexes

    - navigation.path
    - navigation.top

    - navigation.tracking

    - navigation.footer

    - navigation.prune

    # -------------------------------------------------------
    # Search
    # -------------------------------------------------------

    - search.highlight
    - search.suggest
    - search.share

    # -------------------------------------------------------
    # Table of Contents
    # -------------------------------------------------------

    - toc.follow

    # -------------------------------------------------------
    # Content
    # -------------------------------------------------------

    - content.code.copy
    - content.code.annotate
    - content.code.select

    - content.tabs.link

    - content.action.edit
    - content.action.view

    - content.tooltips

plugins:

  - search

# ==============================================================================
# Continue with Part 2
# ==============================================================================

# ==============================================================================
# Markdown Extensions
# ==============================================================================

markdown_extensions:

  # Basic Markdown
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list

  # Table of Contents
  - toc:
      permalink: true
      toc_depth: 3

  # Syntax Highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

  - pymdownx.inlinehilite

  - pymdownx.snippets

  # SuperFences
  - pymdownx.superfences:

      custom_fences:

        - name: mermaid
          class: mermaid

        - name: sequence
          class: mermaid

        - name: flowchart
          class: mermaid

  # Tabs
  - pymdownx.tabbed:
      alternate_style: true

  # Details
  - pymdownx.details

  # Better Lists
  - pymdownx.tasklist:
      custom_checkbox: true

  # Better Formatting
  - pymdownx.mark
  - pymdownx.keys
  - pymdownx.tilde
  - pymdownx.caret
  - pymdownx.magiclink
  - pymdownx.betterem
  - pymdownx.smartsymbols

  # Extra Formatting
  - pymdownx.arithmatex:
      generic: true

# ==============================================================================
# Extra CSS
# ==============================================================================

extra_css:

  - stylesheets/extra.css

# ==============================================================================
# Extra JavaScript
# ==============================================================================

extra_javascript:

  - https://unpkg.com/mermaid/dist/mermaid.min.js
  - javascripts/extra.js

# ==============================================================================
# Extra Configuration
# ==============================================================================

extra:

  generator: false

  homepage: /

  version:

    provider: mike

  social:

    - icon: fontawesome/brands/github
      link: https://github.com/aloksharma22 
      
    - icon: fontawesome/solid/globe


  analytics:

    provider: google

    property: G-XXXXXXXXXX

# ==============================================================================
# Validation
# ==============================================================================

validation:

  omitted_files: warn

  absolute_links: warn

  unrecognized_links: warn

# ==============================================================================
# Watch
# ==============================================================================

watch:

  - docs
  - openapi
  - mkdocs.yml

# ==============================================================================
# End of Part 2
# ==============================================================================

