payroll:

  get:
    tags:
      - Payroll

    summary: List Payroll Records

    description: |
      Retrieves a paginated list of payroll records.

      Supports pagination, searching, filtering, sorting,
      and payroll period filtering.

      This endpoint is commonly used by HR administrators,
      payroll managers, finance teams, and reporting applications.

    operationId: listPayroll

    security:
      - BearerAuth: []

    parameters:

      - $ref: "../components/parameters.yaml#/Page"

      - $ref: "../components/parameters.yaml#/Limit"

      - $ref: "../components/parameters.yaml#/Search"

      - $ref: "../components/parameters.yaml#/Status"

      - $ref: "../components/parameters.yaml#/Sort"

      - $ref: "../components/parameters.yaml#/Order"

      - name: payrollPeriod
        in: query
        required: false

        description: Payroll period in YYYY-MM format.

        schema:
          type: string
          example: "2026-07"

    responses:

      "200":

        description: Payroll records retrieved successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/PaginatedResponse"

                - type: object

                  properties:

                    data:

                      type: array

                      items:
                        $ref: "../components/schemas/payroll.yaml#/Payroll"

            examples:

              Success:
                $ref: "../components/examples/payroll.yaml#/PayrollList"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

  post:
    tags:
      - Payroll

    summary: Generate Payroll

    description: |
      Generates payroll for one or more employees for a specified payroll period.

      The payroll engine calculates gross salary, deductions,
      taxes, provident fund contributions, overtime,
      bonuses, and net salary.

      Generated payroll records become available immediately
      after successful processing.

    operationId: generatePayroll

    security:
      - BearerAuth: []

    requestBody:
      $ref: "../components/requestBodies/payroll.yaml#/GeneratePayrollRequest"

    responses:

      "201":

        description: Payroll generated successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/SuccessResponse"

                - type: object

                  properties:

                    data:
                      $ref: "../components/schemas/payroll.yaml#/Payroll"

            examples:

              Success:
                $ref: "../components/examples/payroll.yaml#/GeneratePayroll"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "409":
        $ref: "../components/responses.yaml#/Conflict"

      "422":
        $ref: "../components/responses.yaml#/ValidationError"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

payrollHistory:

  get:
    tags:
      - Payroll

    summary: Retrieve Payroll History

    description: |
      Retrieves payroll history for an employee.

      Returns payroll records for previous payroll periods,
      allowing payroll administrators and employees to review
      historical salary information.

      Results can be filtered by employee and payroll period.

    operationId: getPayrollHistory

    security:
      - BearerAuth: []

    parameters:

      - name: employeeId
        in: query
        required: false

        description: Unique identifier of the employee.

        schema:
          type: integer
          example: 101

      - name: payrollPeriod
        in: query
        required: false

        description: Payroll period in YYYY-MM format.

        schema:
          type: string
          example: "2026-07"

      - $ref: "../components/parameters.yaml#/Page"

      - $ref: "../components/parameters.yaml#/Limit"

    responses:

      "200":

        description: Payroll history retrieved successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/PaginatedResponse"

                - type: object

                  properties:

                    data:

                      type: array

                      items:
                        $ref: "../components/schemas/payroll.yaml#/Payroll"

            examples:

              Success:
                $ref: "../components/examples/payroll.yaml#/PayrollHistory"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "404":
        $ref: "../components/responses.yaml#/NotFound"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

    x-codeSamples:

      - lang: cURL
        label: cURL

        source: |
          curl --request GET \
            --url "https://api.supercard.com/v1/payroll/history?employeeId=101" \
            --header "Authorization: Bearer ACCESS_TOKEN"

      - lang: JavaScript
        label: JavaScript

        source: |
          const response = await fetch(
            "https://api.supercard.com/v1/payroll/history?employeeId=101",
            {
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

          const data = await response.json();

      - lang: Python
        label: Python

        source: |
          import requests

          response = requests.get(
              "https://api.supercard.com/v1/payroll/history",
              params={
                  "employeeId": 101
              },
              headers={
                  "Authorization": "Bearer ACCESS_TOKEN"
              }
          )

          print(response.json())

      - lang: Node.js
        label: Node.js

        source: |
          import axios from "axios";

          const response = await axios.get(
            "https://api.supercard.com/v1/payroll/history",
            {
              params: {
                employeeId: 101
              },
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

          console.log(response.data);

downloadPayslip:

  get:
    tags:
      - Payroll

    summary: Download Payslip

    description: |
      Downloads the payslip for a specific payroll record.

      A payslip contains salary information including earnings,
      deductions, taxes, provident fund contributions,
      net salary, and payment details.

      The response returns a secure download URL that can be
      used to retrieve the payslip document.

    operationId: downloadPayslip

    security:
      - BearerAuth: []

    parameters:

      - $ref: "../components/parameters.yaml#/PayrollId"

    responses:

      "200":

        description: Payslip generated successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/SuccessResponse"

                - type: object

                  properties:

                    data:

                      type: object

                      properties:

                        payrollId:
                          $ref: "../components/schemas/common.yaml#/Identifier"

                        payrollPeriod:
                          type: string
                          example: "2026-07"

                        fileName:
                          type: string
                          example: payslip-july-2026.pdf

                        downloadUrl:
                          type: string
                          format: uri
                          example: https://api.supercard.com/v1/payroll/7001/payslip

                        expiresAt:
                          $ref: "../components/schemas/common.yaml#/DateTime"

            examples:

              Success:
                $ref: "../components/examples/payroll.yaml#/DownloadPayslip"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "404":
        $ref: "../components/responses.yaml#/NotFound"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

    x-codeSamples:

      - lang: cURL
        label: cURL

        source: |
          curl --request GET \
            --url https://api.supercard.com/v1/payroll/7001/payslip \
            --header "Authorization: Bearer ACCESS_TOKEN"

      - lang: JavaScript
        label: JavaScript

        source: |
          const response = await fetch(
            "https://api.supercard.com/v1/payroll/7001/payslip",
            {
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

          const data = await response.json();

      - lang: Python
        label: Python

        source: |
          import requests

          response = requests.get(
              "https://api.supercard.com/v1/payroll/7001/payslip",
              headers={
                  "Authorization": "Bearer ACCESS_TOKEN"
              }
          )

          print(response.json())

      - lang: Node.js
        label: Node.js

        source: |
          import axios from "axios";

          const response = await axios.get(
            "https://api.supercard.com/v1/payroll/7001/payslip",
            {
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

          console.log(response.data);

salarySummary:

  get:
    tags:
      - Payroll

    summary: Retrieve Salary Summary

    description: |
      Retrieves a salary summary for an employee for a given financial year.

      The summary includes total gross salary, total net salary,
      taxes deducted, provident fund contributions,
      allowances, bonuses, and the number of processed payroll periods.

      This endpoint is commonly used by employees,
      payroll administrators, HR teams,
      and finance departments.

    operationId: getSalarySummary

    security:
      - BearerAuth: []

    parameters:

      - name: employeeId
        in: query
        required: true

        description: Unique identifier of the employee.

        schema:
          type: integer
          example: 101

      - name: financialYear
        in: query
        required: true

        description: Financial year for the salary summary.

        schema:
          type: string
          example: "2026-2027"

    responses:

      "200":

        description: Salary summary retrieved successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/SuccessResponse"

                - type: object

                  properties:

                    data:

                      type: object

                      properties:

                        employeeId:
                          $ref: "../components/schemas/common.yaml#/Identifier"

                        financialYear:
                          type: string
                          example: "2026-2027"

                        totalGrossSalary:
                          $ref: "../components/schemas/common.yaml#/Money"

                        totalNetSalary:
                          $ref: "../components/schemas/common.yaml#/Money"

                        totalTax:
                          $ref: "../components/schemas/common.yaml#/Money"

                        totalProvidentFund:
                          $ref: "../components/schemas/common.yaml#/Money"

                        monthsProcessed:
                          type: integer
                          example: 12

            examples:

              Success:
                $ref: "../components/examples/payroll.yaml#/SalarySummary"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "404":
        $ref: "../components/responses.yaml#/NotFound"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

    x-codeSamples:

      - lang: cURL
        label: cURL

        source: |
          curl --request GET \
            --url "https://api.supercard.com/v1/payroll/salary-summary?employeeId=101&financialYear=2026-2027" \
            --header "Authorization: Bearer ACCESS_TOKEN"

      - lang: JavaScript
        label: JavaScript

        source: |
          const response = await fetch(
            "https://api.supercard.com/v1/payroll/salary-summary?employeeId=101&financialYear=2026-2027",
            {
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

          const data = await response.json();

      - lang: Python
        label: Python

        source: |
          import requests

          response = requests.get(
              "https://api.supercard.com/v1/payroll/salary-summary",
              params={
                  "employeeId": 101,
                  "financialYear": "2026-2027"
              },
              headers={
                  "Authorization": "Bearer ACCESS_TOKEN"
              }
          )

          print(response.json())

      - lang: Node.js
        label: Node.js

        source: |
          import axios from "axios";

          const response = await axios.get(
            "https://api.supercard.com/v1/payroll/salary-summary",
            {
              params: {
                employeeId: 101,
                financialYear: "2026-2027"
              },
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

          console.log(response.data);

              x-codeSamples:

      - lang: cURL
        label: Generate Payroll

        source: |
          curl --request POST \
            --url https://api.supercard.com/v1/payroll \
            --header "Authorization: Bearer ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{
              "payrollPeriod":"2026-07",
              "employeeIds":[101,102,103],
              "payDate":"2026-07-31",
              "remarks":"Monthly payroll processing."
            }'

      - lang: JavaScript
        label: JavaScript

        source: |
          const response = await fetch(
            "https://api.supercard.com/v1/payroll",
            {
              method: "POST",
              headers: {
                "Authorization": "Bearer ACCESS_TOKEN",
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                payrollPeriod: "2026-07",
                employeeIds: [101, 102, 103],
                payDate: "2026-07-31",
                remarks: "Monthly payroll processing."
              })
            }
          );

          const data = await response.json();

      - lang: Python
        label: Python

        source: |
          import requests

          response = requests.post(
              "https://api.supercard.com/v1/payroll",
              headers={
                  "Authorization": "Bearer ACCESS_TOKEN",
                  "Content-Type": "application/json"
              },
              json={
                  "payrollPeriod": "2026-07",
                  "employeeIds": [101, 102, 103],
                  "payDate": "2026-07-31",
                  "remarks": "Monthly payroll processing."
              }
          )

          print(response.json())

      - lang: Node.js
        label: Node.js

        source: |
          import axios from "axios";

          const response = await axios.post(
            "https://api.supercard.com/v1/payroll",
            {
              payrollPeriod: "2026-07",
              employeeIds: [101, 102, 103],
              payDate: "2026-07-31",
              remarks: "Monthly payroll processing."
            },
            {
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

          console.log(response.data);

