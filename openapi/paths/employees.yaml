employees:

  get:
    tags:
      - Employees

    summary: List Employees

    description: |
      Retrieves a paginated list of employees.

      Supports pagination, searching, filtering, and sorting.

      Typical use cases include:

      - Employee directory
      - HR dashboards
      - Administrative portals
      - Reporting

    operationId: listEmployees

    security:
      - BearerAuth: []

    parameters:

      - $ref: "../components/parameters.yaml#/Page"

      - $ref: "../components/parameters.yaml#/Limit"

      - $ref: "../components/parameters.yaml#/Search"

      - $ref: "../components/parameters.yaml#/Department"

      - $ref: "../components/parameters.yaml#/Status"

      - $ref: "../components/parameters.yaml#/Sort"

      - $ref: "../components/parameters.yaml#/Order"

    responses:

      "200":

        description: Employees retrieved successfully.

        content:

          application/json:

            schema:
              allOf:

                - $ref: "../components/schemas/common.yaml#/PaginatedResponse"

                - type: object

                  properties:

                    data:

                      type: array

                      items:
                        $ref: "../components/schemas/employee.yaml#/Employee"

            examples:

              Success:
                $ref: "../components/examples/employee.yaml#/EmployeeList"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

  post:
    tags:
      - Employees

    summary: Create Employee

    description: |
      Creates a new employee.

      The employee becomes available immediately after successful creation.

      Required business information includes employee identity,
      department assignment, employment type, and joining date.

    operationId: createEmployee

    security:
      - BearerAuth: []

    requestBody:
      $ref: "../components/requestBodies/employee.yaml#/CreateEmployeeRequest"

    responses:

      "201":

        description: Employee created successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/SuccessResponse"

                - type: object

                  properties:

                    data:
                      $ref: "../components/schemas/employee.yaml#/Employee"

            examples:

              Success:
                $ref: "../components/examples/employee.yaml#/CreateEmployee"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "409":
        $ref: "../components/responses.yaml#/Conflict"

      "422":
        $ref: "../components/responses.yaml#/ValidationError"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

employee:

  get:
    tags:
      - Employees

    summary: Retrieve Employee

    description: |
      Retrieves detailed information for a single employee using the employee identifier.

      Use this endpoint to fetch an employee profile including
      personal information, employment details, department,
      salary, and status.

    operationId: getEmployeeById

    security:
      - BearerAuth: []

    parameters:

      - $ref: "../components/parameters.yaml#/EmployeeId"

    responses:

      "200":

        description: Employee retrieved successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/SuccessResponse"

                - type: object

                  properties:

                    data:
                      $ref: "../components/schemas/employee.yaml#/Employee"

            examples:

              Success:
                $ref: "../components/examples/employee.yaml#/Employee"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "404":
        $ref: "../components/responses.yaml#/NotFound"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

  put:
    tags:
      - Employees

    summary: Update Employee

    description: |
      Updates an existing employee.

      Only the supplied fields are updated. Fields omitted from
      the request retain their current values.

      This endpoint is typically used by HR administrators to
      maintain employee information.

    operationId: updateEmployee

    security:
      - BearerAuth: []

    parameters:

      - $ref: "../components/parameters.yaml#/EmployeeId"

    requestBody:
      $ref: "../components/requestBodies/employee.yaml#/UpdateEmployeeRequest"

    responses:

      "200":

        description: Employee updated successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/SuccessResponse"

                - type: object

                  properties:

                    data:
                      $ref: "../components/schemas/employee.yaml#/Employee"

            examples:

              Success:
                $ref: "../components/examples/employee.yaml#/UpdateEmployee"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "404":
        $ref: "../components/responses.yaml#/NotFound"

      "409":
        $ref: "../components/responses.yaml#/Conflict"

      "422":
        $ref: "../components/responses.yaml#/ValidationError"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

  delete:
    tags:
      - Employees

    summary: Delete Employee

    description: |
      Permanently deletes an employee from the system.

      This operation should be used with caution. Once deleted,
      the employee record can no longer be retrieved.

      In production environments, organizations may choose to
      implement soft deletion instead of permanently removing
      employee records.

    operationId: deleteEmployee

    security:
      - BearerAuth: []

    parameters:

      - $ref: "../components/parameters.yaml#/EmployeeId"

    responses:

      "200":

        description: Employee deleted successfully.

        content:

          application/json:

            schema:
              $ref: "../components/schemas/common.yaml#/SuccessResponse"

            examples:

              Success:
                $ref: "../components/examples/employee.yaml#/DeleteEmployee"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "404":
        $ref: "../components/responses.yaml#/NotFound"

      "409":
        $ref: "../components/responses.yaml#/Conflict"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

    x-codeSamples:

      - lang: cURL
        label: cURL

        source: |
          curl --request DELETE \
            --url https://api.supercard.com/v1/employees/101 \
            --header "Authorization: Bearer ACCESS_TOKEN"

      - lang: JavaScript
        label: JavaScript

        source: |
          const response = await fetch(
            "https://api.supercard.com/v1/employees/101",
            {
              method: "DELETE",
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

          const data = await response.json();

      - lang: Python
        label: Python

        source: |
          import requests

          response = requests.delete(
              "https://api.supercard.com/v1/employees/101",
              headers={
                  "Authorization": "Bearer ACCESS_TOKEN"
              }
          )

          print(response.json())

      - lang: Node.js
        label: Node.js

        source: |
          import axios from "axios";

          const response = await axios.delete(
            "https://api.supercard.com/v1/employees/101",
            {
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

          console.log(response.data);
