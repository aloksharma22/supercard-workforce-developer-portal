        source: |
          curl --request GET \
            --url "https://api.supercard.com/v1/attendance/report?startDate=2026-07-01&endDate=2026-07-31" \
            --header "Authorization: Bearer ACCESS_TOKEN"

      - lang: JavaScript
        label: JavaScript

        source: |
          const response = await fetch(
