departments:

  get:
    tags:
      - Departments

    summary: List Departments

    description: |
      Retrieves a paginated list of departments.

      Supports searching, pagination, filtering, and sorting.

      This endpoint is commonly used by HR portals,
      administrative dashboards, and reporting applications.

    operationId: listDepartments

    security:
      - BearerAuth: []

    parameters:

      - $ref: "../components/parameters.yaml#/Page"

      - $ref: "../components/parameters.yaml#/Limit"

      - $ref: "../components/parameters.yaml#/Search"

      - $ref: "../components/parameters.yaml#/Status"

      - $ref: "../components/parameters.yaml#/Sort"

      - $ref: "../components/parameters.yaml#/Order"

    responses:

      "200":

        description: Departments retrieved successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/PaginatedResponse"

                - type: object

                  properties:

                    data:

                      type: array

                      items:
                        $ref: "../components/schemas/department.yaml#/Department"

            examples:

              Success:
                $ref: "../components/examples/department.yaml#/DepartmentList"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

  post:
    tags:
      - Departments

    summary: Create Department

    description: |
      Creates a new department within the organization.

      Departments are used to organize employees,
      reporting structures, and payroll processing.

    operationId: createDepartment

    security:
      - BearerAuth: []

    requestBody:
      $ref: "../components/requestBodies/department.yaml#/CreateDepartmentRequest"

    responses:

      "201":

        description: Department created successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/SuccessResponse"

                - type: object

                  properties:

                    data:
                      $ref: "../components/schemas/department.yaml#/Department"

            examples:

              Success:
                $ref: "../components/examples/department.yaml#/CreateDepartment"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "409":
        $ref: "../components/responses.yaml#/Conflict"

      "422":
        $ref: "../components/responses.yaml#/ValidationError"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

department:

  get:
    tags:
      - Departments

    summary: Retrieve Department

    description: |
      Retrieves detailed information for a specific department using its unique identifier.

      The response includes department information such as
      department details, manager information, employee count,
      location, budget, and current status.

    operationId: getDepartmentById

    security:
      - BearerAuth: []

    parameters:

      - $ref: "../components/parameters.yaml#/DepartmentId"

    responses:

      "200":

        description: Department retrieved successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/SuccessResponse"

                - type: object

                  properties:

                    data:
                      $ref: "../components/schemas/department.yaml#/Department"

            examples:

              Success:
                $ref: "../components/examples/department.yaml#/Department"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "404":
        $ref: "../components/responses.yaml#/NotFound"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

  put:
    tags:
      - Departments

    summary: Update Department

    description: |
      Updates an existing department.

      Only the fields supplied in the request are updated.
      Fields omitted from the request retain their existing values.

      This endpoint is typically used to update department
      information, management assignments, budgets, and locations.

    operationId: updateDepartment

    security:
      - BearerAuth: []

    parameters:

      - $ref: "../components/parameters.yaml#/DepartmentId"

    requestBody:
      $ref: "../components/requestBodies/department.yaml#/UpdateDepartmentRequest"

    responses:

      "200":

        description: Department updated successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/SuccessResponse"

                - type: object

                  properties:

                    data:
                      $ref: "../components/schemas/department.yaml#/Department"

            examples:

              Success:
                $ref: "../components/examples/department.yaml#/UpdateDepartment"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "404":
        $ref: "../components/responses.yaml#/NotFound"

      "409":
        $ref: "../components/responses.yaml#/Conflict"

      "422":
        $ref: "../components/responses.yaml#/ValidationError"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

  delete:
    tags:
      - Departments

    summary: Delete Department

    description: |
      Permanently deletes a department from the organization.

      This operation should be used only when the department is no longer required.
      Before deleting a department, ensure that employees assigned to it have been
      reassigned or removed according to organizational policies.

      In production environments, many organizations implement soft deletion
      instead of permanently removing department records.

    operationId: deleteDepartment

    security:
      - BearerAuth: []

    parameters:

      - $ref: "../components/parameters.yaml#/DepartmentId"

    responses:

      "200":

        description: Department deleted successfully.

        content:

          application/json:

            schema:
              $ref: "../components/schemas/common.yaml#/SuccessResponse"

            examples:

              Success:
                $ref: "../components/examples/department.yaml#/DeleteDepartment"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "404":
        $ref: "../components/responses.yaml#/NotFound"

      "409":
        $ref: "../components/responses.yaml#/Conflict"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

    x-codeSamples:

      - lang: cURL
        label: cURL

        source: |
          curl --request DELETE \
            --url https://api.supercard.com/v1/departments/10 \
            --header "Authorization: Bearer ACCESS_TOKEN"

      - lang: JavaScript
        label: JavaScript

        source: |
          const response = await fetch(
            "https://api.supercard.com/v1/departments/10",
            {
              method: "DELETE",
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

          const data = await response.json();

      - lang: Python
        label: Python

        source: |
          import requests

          response = requests.delete(
              "https://api.supercard.com/v1/departments/10",
              headers={
                  "Authorization": "Bearer ACCESS_TOKEN"
              }
          )

          print(response.json())

      - lang: Node.js
        label: Node.js

        source: |
          import axios from "axios";

          const response = await axios.delete(
            "https://api.supercard.com/v1/departments/10",
            {
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

          console.log(response.data);