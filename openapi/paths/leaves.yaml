leaveBalance:

  get:
    tags:
      - Leaves

    summary: Retrieve Leave Balance

    description: |
      Retrieves the current leave balance for an employee.

      The response includes the allocated, used, and remaining
      leave balance for each supported leave type.

      This endpoint is commonly used by employee self-service
      portals, HR dashboards, and leave management systems.

    operationId: getLeaveBalance

    security:
      - BearerAuth: []

    parameters:

      - name: employeeId
        in: query
        required: true

        description: Unique identifier of the employee.

        schema:
          type: integer
          example: 101

    responses:

      "200":

        description: Leave balance retrieved successfully.

        content:

          application/json:

            schema:
              $ref: "../components/schemas/common.yaml#/SuccessResponse"

            examples:

              Success:
                $ref: "../components/examples/leave.yaml#/LeaveBalance"

      "400":
        $ref: "../components/responses.yaml#/BadRequest"

      "401":
        $ref: "../components/responses.yaml#/Unauthorized"

      "403":
        $ref: "../components/responses.yaml#/Forbidden"

      "404":
        $ref: "../components/responses.yaml#/NotFound"

      "429":
        $ref: "../components/responses.yaml#/TooManyRequests"

      "500":
        $ref: "../components/responses.yaml#/InternalServerError"

      "503":
        $ref: "../components/responses.yaml#/ServiceUnavailable"

    x-codeSamples:

      - lang: cURL
        label: cURL

        source: |
          curl --request GET \
            --url "https://api.supercard.com/v1/leaves/balance?employeeId=101" \
            --header "Authorization: Bearer ACCESS_TOKEN"

      - lang: JavaScript
        label: JavaScript

        source: |
          const response = await fetch(
            "https://api.supercard.com/v1/leaves/balance?employeeId=101",
            {
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

          const data = await response.json();

      - lang: Python
        label: Python

        source: |
          import requests

          response = requests.get(
              "https://api.supercard.com/v1/leaves/balance",
              params={
                  "employeeId": 101
              },
              headers={
                  "Authorization": "Bearer ACCESS_TOKEN"
              }
          )

          print(response.json())

      - lang: Node.js
        label: Node.js

        source: |
          import axios from "axios";

          const response = await axios.get(
            "https://api.supercard.com/v1/leaves/balance",
            {
              params: {
                employeeId: 101
              },
              headers: {
                Authorization: "Bearer ACCESS_TOKEN"
              }
            }
          );

