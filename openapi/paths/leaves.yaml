cancelLeave:

  post:
    tags:
      - Leaves

    summary: Cancel Leave Request

    description: |
      Cancels a previously submitted leave request.

      Employees can cancel pending leave requests before they are
      approved. Depending on organizational policies, approved leave
      requests may also be cancelled if cancellation is permitted.

      Once cancelled, the leave status changes to **Cancelled**
      and the employee's leave balance is updated if applicable.

    operationId: cancelLeave

    security:
      - BearerAuth: []

    parameters:

      - $ref: "../components/parameters.yaml#/LeaveId"

    requestBody:
      $ref: "../components/requestBodies/leave.yaml#/CancelLeaveRequest"

    responses:

      "200":

        description: Leave request cancelled successfully.

        content:

          application/json:

            schema:

              allOf:

                - $ref: "../components/schemas/common.yaml#/SuccessResponse"

                - type: object

                  properties:

                    data:
                      $ref: "../components/schemas/leave.yaml#/Leave"

            examples:

              Success:
