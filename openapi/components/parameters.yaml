EmployeeId:
  name: employeeId
  in: path
  required: true
  description: Unique identifier of the employee.
  schema:
    type: integer
    example: 101

DepartmentId:
  name: departmentId
  in: path
  required: true
  description: Unique identifier of the department.
  schema:
    type: integer
    example: 10

AttendanceId:
  name: attendanceId
  in: path
  required: true
  description: Unique identifier of the attendance record.
  schema:
    type: integer
    example: 1001

LeaveId:
  name: leaveId
  in: path
  required: true
  description: Unique identifier of the leave request.
  schema:
    type: integer
    example: 5001

PayrollId:
  name: payrollId
  in: path
  required: true
  description: Unique identifier of the payroll record.
  schema:
    type: integer
    example: 7001

Page:
  name: page
  in: query
  required: false
  description: Page number to retrieve.
  schema:
    type: integer
    minimum: 1
    default: 1
    example: 1

Limit:
  name: limit
  in: query
  required: false
  description: Number of records returned per page.
  schema:
    type: integer
    minimum: 1
    maximum: 100
    default: 25
    example: 25

Sort:
  name: sort
  in: query
  required: false
  description: Field used to sort the response.
  schema:
    type: string
    example: lastName

Order:
  name: order
  in: query
  required: false
  description: Sort direction.
  schema:
    type: string
    enum:
      - asc
      - desc
    default: asc
    example: asc

Search:
  name: search
  in: query
  required: false
  description: Free-text search keyword.
  schema:
    type: string
    example: John

Status:
  name: status
  in: query
  required: false
  description: Filter resources by status.
  schema:
    type: string
    example: Active

Department:
  name: department
  in: query
  required: false
  description: Filter resources by department name.
  schema:
    type: string
    example: Engineering

StartDate:
  name: startDate
  in: query
  required: false
  description: Filter records created on or after this date (ISO 8601).
  schema:
    type: string
    format: date
    example: "2026-01-01"

EndDate:
  name: endDate
  in: query
  required: false
  description: Filter records created on or before this date (ISO 8601).
  schema:
    type: string
    format: date
    example: "2026-01-31"